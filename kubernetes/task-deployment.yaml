apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: task-service

  template:
    metadata:
      labels:
        app: task-service

    spec:
      containers:
        - name: task-service
          image: dnyanechetan/taskflow-task-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8081

          envFrom:
            - configMapRef:
                name: task-config

            - secretRef:
                name: taskflow-secrets