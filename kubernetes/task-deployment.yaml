apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: task-service

  template:
    metadata:
      labels:
        app: task-service

    spec:
      containers:
        - name: task-service
          image: dnyanechetan/taskflow-task-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8081

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5

          envFrom:
            - configMapRef:
                name: task-config

            - secretRef:
                name: taskflow-secrets