apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      app: taskflow-ui
  template:
    metadata:
      labels:
        app: taskflow-ui
    spec:
      containers:
        - name: taskflow-ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ui.port }}
